[package]
name = "webrtc-mdns"
version = "0.7.0"
authors = ["Rain Liu <yuliu@webrtc.rs>"]
edition = "2021"
description = "A pure Rust implementation of mDNS"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/webrtc-mdns"
homepage = "https://webrtc.rs"
repository = "https://github.com/webrtc-rs/mdns"
autoexamples = false

[features]
default = ["reuse_port"]
reuse_port = []

[dependencies]
util = { version = "0.9.0", path = "../util", package = "webrtc-util", default-features = false, features = [
  "ifaces",
] }

log = "0.4"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "1"
tokio = { version = "1.32.0", features = [
  "fs",
  "io-util",
  "io-std",
  "macros",
  "net",
  "parking_lot",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[dev-dependencies]
env_logger = "0.10"
chrono = "0.4.28"
clap = "3"
