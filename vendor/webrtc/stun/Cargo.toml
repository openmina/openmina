[package]
name = "stun"
version = "0.6.0"
authors = ["Rain Liu <yuliu@webrtc.rs>"]
edition = "2021"
description = "A pure Rust implementation of STUN"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/stun"
homepage = "https://webrtc.rs"
repository = "https://github.com/webrtc-rs/stun"
autoexamples = false

[features]
default = []
bench = []

[dependencies]
util = { version = "0.9.0", path = "../util", package = "webrtc-util", default-features = false, features = [
  "conn",
] }

base64 = "0.21"
crc = "3"
lazy_static = "1"
md-5 = "0.10"
rand = "0.8"
ring = "0.17"
subtle = "2.4"
thiserror = "1"
tokio = { version = "1.32.0", features = [
  "fs",
  "io-util",
  "io-std",
  "macros",
  "net",
  "parking_lot",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = "2"

[dev-dependencies]
tokio-test = "0.4"
clap = "3"
criterion = "0.5"


[[bench]]
name = "bench"
harness = false
