[package]
name = "webrtc-dtls"
version = "0.10.0"
authors = ["Rain Liu <yuliu@webrtc.rs>"]
edition = "2021"
description = "A pure Rust implementation of DTLS"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/webrtc-dtls"
homepage = "https://webrtc.rs"
repository = "https://github.com/webrtc-rs/dtls"
autoexamples = false

[dependencies]
util = { version = "0.9.0", path = "../util", package = "webrtc-util", default-features = false, features = [
  "conn",
] }

aes = "0.8"
aes-gcm = "0.10"
async-trait = "0.1"
bincode = "1"
byteorder = "1"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
ccm = "0.5"
der-parser = "8.1"
hkdf = "0.12"
hmac = "0.12"
log = "0.4"
p256 = { version = "0.13", features = ["default", "ecdh", "ecdsa"] }
p384 = "0.13"
pem = { version = "3", optional = true }
portable-atomic = "1.6"
rand = "0.8"
rand_core = "0.6"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
] }
sec1 = { version = "0.7", features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
tokio = { version = "1.32.0", features = [
  "fs",
  "io-util",
  "io-std",
  "macros",
  "net",
  "parking_lot",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.16"

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.10"
chrono = "0.4.28"
clap = "3"

[features]
pem = ["dep:pem"]
