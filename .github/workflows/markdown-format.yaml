name: Markdown Format Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  markdown-format:
    name: Check Markdown Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check markdown formatting
        run: make check-md
