<app-memory-resources-toolbar></app-memory-resources-toolbar>
<app-memory-resources-treemap
  class="pl-12 pr-12"
></app-memory-resources-treemap>
<div class="h-xl">
  <mina-horizontal-menu
    [template]="breadcrumbsRef"
    [clz]="'pl-12 pr-12 h-xl'"
  ></mina-horizontal-menu>
  <ng-template #breadcrumbsRef>
    @for (
      breadcrumb of breadcrumbs;
      track breadcrumb.name.executableName;
      let i = $index
    ) {
      <span
        class="breadcrumb mr-10 text-nowrap"
        (click)="setActiveResource(breadcrumb)"
      >
        {{ breadcrumb.name.executableName }}
      </span>
      @if (i !== breadcrumbs.length - 1) {
        <span class="mina-icon icon-200 mr-10 tertiary">chevron_right</span>
      }
    }
  </ng-template>
</div>
<app-memory-resources-table></app-memory-resources-table>
