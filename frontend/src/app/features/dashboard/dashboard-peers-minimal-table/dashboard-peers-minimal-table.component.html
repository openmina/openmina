<ng-container #minaTable></ng-container>

<ng-template #rowTemplate let-row="row">
  <span class="fx-row-vert-cent text-capitalize" [ngClass]="row.status">
    @if (row.status === DashboardPeerStatus.CONNECTING) {
      <mina-loading-spinner></mina-loading-spinner>
    } @else {
      <span class="mina-icon icon-200 f-big">circle</span>
    }
    {{ row.status }}
  </span>
  <span>{{ row.datetime }}</span>
  <span>{{ row.height ?? '-' }}</span>
</ng-template>
